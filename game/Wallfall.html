<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Wallfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Silkscreen&display=swap">
<style>

:root{
  --night:#120b0a;
  --smoke:#2a1612;
  --ember:#ff8a3d;
  --stone:#8c7d6a;
  --ash:#eadfd2;
  --muted:#a8968a;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --ui:"Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ash)}
body{
  font-family:var(--ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
  background:radial-gradient(120% 70% at 50% 0%, var(--smoke) 0%, var(--night) 70%) var(--night);
  min-height:100%;
}
.wrap{max-width:1024px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-bottom:12px;border-bottom:1px solid #3a2a22;position:relative}
header::after{content:"";position:absolute;left:0;bottom:-3px;width:56px;height:5px;background:var(--ember);clip-path:polygon(0 40%,100% 40%,100% 60%,0 60%)}
.eyebrow{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin:0 0 6px;opacity:.85}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,3.2rem);margin:0;letter-spacing:.02em;color:var(--ember);line-height:1;text-wrap:balance}
.tag{margin:0;color:var(--muted);font-size:.72rem;letter-spacing:.06em;max-width:50ch;line-height:1.6}
.frame{position:relative;padding:7px;background:linear-gradient(180deg,#4f463f,#221c18);border-radius:4px;box-shadow:0 0 0 1px #000000a0, 0 24px 70px #000a, 0 0 120px #ff8a3d14, inset 0 1px 0 #ffffff26, inset 0 0 0 2px #6b523640}
.frame::before,.frame::after{content:"";position:absolute;top:2px;width:3px;height:3px;border-radius:50%;background:#a07a46}
.frame::before{left:2px} .frame::after{right:2px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;background:#0b0706;max-width:100%;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--ember)}
.frame:fullscreen,.frame.fakefs{display:flex;align-items:center;justify-content:center;padding:0;border-radius:0;background:#000;box-shadow:none}
.frame.fakefs{position:fixed;inset:0;z-index:50}
.frame:fullscreen::before,.frame:fullscreen::after,.frame.fakefs::before,.frame.fakefs::after{display:none}
.frame:fullscreen #game,.frame.fakefs #game{width:min(100vw,calc(100vh * 16 / 9));height:auto;max-width:none}
.frame:fullscreen .mapc,.frame.fakefs .mapc{left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9}
.fsx{display:none;position:absolute;bottom:10px;right:10px;opacity:.55;z-index:3;font:600 .7rem/1 ui-monospace,monospace;letter-spacing:.06em;padding:8px 10px;border-radius:3px;border:1px solid #6b5236;background:#1a1210cc;color:#e8dcc8;cursor:pointer}
.frame:fullscreen .fsx,.frame.fakefs .fsx{display:block}
.ver{position:absolute;right:13px;bottom:11px;z-index:1;margin:0;font-size:.55rem;letter-spacing:.08em;color:var(--ash);opacity:.4;pointer-events:none;user-select:none}
.frame:fullscreen .ver,.frame.fakefs .ver{display:none}
.bar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#1f1512,#171010);border:1px solid #3a2a22;border-radius:4px;padding-block:12px;padding-inline:14px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 18px;font-size:.62rem;color:var(--muted);letter-spacing:.05em;flex:1 1 420px;min-width:0}
.keys span{display:inline-flex;gap:5px;align-items:center;min-width:0}
kbd{font-family:var(--ui);font-size:.6rem;color:#2a1d16;background:#e3d6bd;border:0;box-shadow:0 2px 0 #8a7a62, inset 0 1px 0 #fff6e6;border-radius:2px;padding:2px 6px;min-width:1.4em;text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.bar{display:none}
.menuov[hidden]{display:none}
.menuov{position:absolute;bottom:26px;right:12px;z-index:2;width:30px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid #a07a4666;border-radius:3px;background:#140d0bb0;color:#e3d6bd;opacity:.6;cursor:pointer}
.menuov:hover,.menuov:focus-visible{opacity:1;outline:none;border-color:#ff9a5a}
.menuov svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.card.treecard{max-width:620px;width:100%;padding:14px 16px;color:#eadfd2;background:radial-gradient(60% 50% at 50% 100%,#ff7a2e1c,transparent 70%),#0d0908;border:1px solid #a07a4655}
.treecard .kicker{color:#ff9a5a}.treecard h2{color:#f2e2c4;font-size:1.25rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.tshard{width:9px;height:14px;background:linear-gradient(#ffd27a,#c43a14);clip-path:polygon(50% 0,100% 40%,70% 100%,30% 100%,0 40%);display:inline-block}
.tree{position:relative;width:100%;aspect-ratio:520/300;margin:4px 0 6px}
.tree>svg{position:absolute;inset:0;width:100%;height:100%}
.card.treecard .tree button.tnode{position:absolute;transform:translate(-50%,-50%);width:clamp(24px,6.4%,34px);aspect-ratio:1;border-radius:50%;padding:0;margin:0;border:2px solid #4a423c;background:#16110f;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:0}
.card.treecard .tree button.tnode svg{width:58%;height:58%;fill:none;stroke:#6a605a;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.card.treecard .tree button.tnode.got{border-color:var(--c);background:var(--c);box-shadow:0 0 10px var(--c)}
.card.treecard .tree button.tnode.got svg{stroke:#140c0a}
.card.treecard .tree button.tnode.got.part{background:#16110f}.tree button.tnode.got.part svg{stroke:var(--c)}
.card.treecard .tree button.tnode.can{border-color:var(--c);box-shadow:0 0 8px var(--c);animation:tpulse 1.4s ease-in-out infinite}
.card.treecard .tree button.tnode.can svg{stroke:var(--c)}
.card.treecard .tree button.tnode.lock{opacity:.55}
.card.treecard .tree button.tnode:focus-visible,.tree button.tnode:hover{outline:2px solid #fff0d8;outline-offset:2px}
.card.treecard .tree button.tnode i{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:600 .55rem var(--ui);color:#d8ccc0;font-style:normal;margin-top:2px;white-space:nowrap}
@keyframes tpulse{50%{box-shadow:0 0 16px var(--c)}}
.tlab{position:absolute;transform:translate(-50%,-50%);font:600 .6rem var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--c);opacity:.6;text-align:center;line-height:1.25;pointer-events:none}
.tlab b{display:block;font-size:.95rem;letter-spacing:0;color:#f2e2c4}
.tlab em{display:block;font-style:normal;font-size:.5rem;color:#fff0d8;letter-spacing:.1em}
.tlab.on{opacity:1;text-shadow:0 0 8px var(--c)}
.card.treecard button.opt{color:#eadfd2;border-bottom-color:#ffffff14}.tinfo{min-height:2.6em;margin:0 0 4px;font-size:.85rem;color:#d8ccc0;text-align:center}.tmsg{margin:0 0 8px;font:600 .62rem var(--ui);letter-spacing:.08em;color:#ffb04a;text-align:center}
@media (prefers-reduced-motion:reduce){.tree button.tnode.can{animation:none}}
.card.pausecard{max-width:440px}
.card.soundcard{max-width:420px}
.vrow{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3em;gap:10px;align-items:center;margin:8px 0;font-size:1rem}
.vrow input{width:100%;accent-color:#8e2f22}
.vv{font-family:var(--ui);font-size:.6rem;text-align:right;color:var(--faded)}
.card.pausecard .opts.pgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.card.pausecard button.opt .t{font-size:.98rem}
@media (max-width:420px){ .card.pausecard .opts.pgrid{grid-template-columns:1fr} }
button{font-family:var(--ui);font-size:.64rem;letter-spacing:.06em;color:var(--ash);background:linear-gradient(180deg,#3a2e28,#241b17);border:1px solid #5a4636;border-radius:3px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:inset 0 1px 0 #ffffff14}
button svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button:hover{border-color:var(--ember);color:#ffd2a0}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.touch{display:none;justify-content:space-between;align-items:end;gap:8px;user-select:none;-webkit-user-select:none;touch-action:none}
.touch button{height:52px;font-size:.6rem;padding:0;border-radius:50%;justify-content:center;background:radial-gradient(circle at 50% 35%,#4a3a30,#1e1613);border:1px solid #6b5236;box-shadow:inset 0 1px 0 #ffffff1a,0 3px 0 #0008;touch-action:none}
.touch button.on{background:#ff8a3d55;border-color:var(--ember)}
.touch .gap{min-width:0}
.tpad{display:grid;grid-template-columns:repeat(2,52px);gap:8px}.tact{display:grid;grid-template-columns:repeat(4,52px);gap:8px}
@media (pointer:coarse){ .touch{display:flex} .keys{display:none} }
@media (max-width:420px){ .tpad,.tact{gap:5px} .tpad{grid-template-columns:repeat(2,44px)} .tact{grid-template-columns:repeat(4,44px)} .touch button{height:44px;font-size:.55rem} }
.dlg[hidden]{display:none}
.dlg.talking{align-items:flex-end;background:linear-gradient(#0a060500 30%,#0a0605d0)}
.card.convo{max-width:640px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:12px 16px 10px;color:#eadfd2;background:radial-gradient(60% 80% at 0% 0%,#ff7a2e18,transparent 70%),#140d0bf2;border:1px solid #a07a4666}
.cvp canvas{width:104px;height:112px;image-rendering:pixelated;border:1px solid #ffffff14;border-radius:2px;background:radial-gradient(60% 50% at 50% 70%,#5a2a1a,#1a0e0b 80%)}
.cvname{font-family:var(--display);font-size:1.35rem;line-height:1.1;margin:0 0 6px;color:#f2e2c4}
.cvname span{display:block;font-family:var(--ui);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:#a0907e;margin-top:3px}
.card.convo p.body{color:#e6d8c2;font-style:normal;font-size:1rem;margin:0 0 6px}
.card.convo .opts{border-top:1px solid #ffffff18;margin-top:8px}
.card.convo button.opt{color:#eadfd2;border-bottom-color:#ffffff12;align-items:center}
.card.convo button.opt:hover,.card.convo button.opt:focus-visible{background:#ffffff0c;box-shadow:inset 3px 0 0 #ff9a5a}
.card.convo .n{color:#a0907e}
.tone{margin-left:auto;font-family:var(--ui);font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 5px;border-radius:2px;white-space:nowrap}
.tone.heal{color:#ffd08a;border:1px solid #ffd08a55}.tone.cut{color:#ff7a5a;border:1px solid #ff7a5a55}
@media (max-width:520px){ .card.convo{grid-template-columns:1fr} .cvp canvas{width:78px;height:84px} }
.card.admin{max-width:560px;color:#eadfd2;background:#140d0bf2;border:1px solid #7ad8ff55}
.card.admin .kicker{color:#7ad8ff}.card.admin h2{color:#f2e2c4}
.adl{font-family:var(--ui);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:#a0907e;margin:10px 0 4px}
.adrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.adb{font-family:var(--ui);font-size:.55rem;letter-spacing:.04em;padding:5px 8px;border:1px solid #ffffff22;background:#ffffff0a;color:#eadfd2;border-radius:2px;cursor:pointer}
.adb:hover{background:#ffffff18}.adb.on{border-color:#7ad8ff;background:#7ad8ff22;color:#cfefff}
.card.admin select{font:.85rem Georgia,serif;padding:4px;background:#1e1612;color:#eadfd2;border:1px solid #ffffff22;max-width:260px}
.card.admin .cf input{font:1rem ui-monospace,monospace;padding:6px 8px;background:#1e1612;color:#eadfd2;border:1px solid #ffffff33}
.card.admin .small{font-size:.85rem;color:#7ad8ff;margin:8px 0 0}
.card.admin .opts{border-top-color:#ffffff18}.card.admin button.opt{color:#eadfd2}
.dlg.ontitle{background:transparent;align-items:flex-end;padding-bottom:9%}
.titlemenu{display:flex;flex-direction:column;align-items:center;gap:6px}
.titlemenu .opts{display:flex;flex-direction:column;gap:4px;margin:0;border:0;min-width:220px}
.titlemenu .opt{background:#140d0bcc;border:1px solid #a07a4655;color:#f2e2c4;font-family:"IM Fell English",Georgia,serif;font-size:1.05rem;padding:6px 14px;text-align:center;border-radius:2px;cursor:pointer}
.titlemenu .opt:hover,.titlemenu .opt:focus-visible{background:#3a1c14ee;border-color:#ff9a5a;outline:none;box-shadow:inset 0 -2px 0 #ff9a5a}
.titlemenu .tsub{margin:4px 0 0;font-family:var(--ui);font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;color:#e3c8a0;text-shadow:0 1px 2px #000}
.mapc{position:absolute;left:7px;top:7px;width:calc(100% - 14px);height:calc(100% - 14px);pointer-events:none;z-index:2}
.mapc[hidden]{display:none}
.dlg{position:absolute;inset:6px;z-index:3;display:flex;align-items:center;justify-content:center;padding:12px;background:#0a0605cc;overflow:auto}
.card{
  --paper:#e3d6bd; --ink:#2a1d16; --seal:#8e2f22; --faded:#6e5a48;
  font-family:"IM Fell English", "Iowan Old Style", Georgia, serif;
  background:radial-gradient(60% 40% at 85% 10%, #b8925a44, transparent 70%), radial-gradient(50% 35% at 10% 95%, #6b3a2033, transparent 70%), var(--paper);
  color:var(--ink);width:100%;max-width:480px;max-height:100%;overflow:auto;padding:20px 22px;border-radius:2px;
  box-shadow:0 18px 50px #000a, inset 0 0 0 1px #0000001a;
}
.card .kicker{font-family:var(--ui);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--seal);margin:0 0 6px}
.card h2{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.1;margin:0 0 10px;text-wrap:balance}
.card p.body{margin:0 0 10px;font-size:1.02rem;line-height:1.45;font-style:italic}
.opts{display:flex;flex-direction:column;margin-top:14px;border-top:1px solid #2a1d1633;transition:opacity .25s}
.card.typing .opts{opacity:.3;pointer-events:none}
.card.coop label.cf{display:flex;flex-direction:column;gap:4px;margin-top:12px;font:600 .62rem/1.2 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#7a5a3c}
.card.coop input{font:1rem/1.2 ui-monospace,monospace;padding:6px 8px;border:1px solid #a08a6a;background:#fbf4e4;color:#2a1d16;border-radius:2px;letter-spacing:.06em}
.card.coop input#cCode{text-transform:uppercase;letter-spacing:.3em;font-size:1.1rem}
.card.coop .opts{margin-top:8px}
.card.coop .small{font-size:.8rem;opacity:.8}
.card.coop ul.plist{list-style:none;margin:10px 0 0;padding:0;font-size:.95rem}
.card.coop ul.plist li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #2a1d1622}
.card.coop ul.plist i{width:10px;height:10px;border-radius:50%;display:inline-block}
.card button.opt{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;font-family:inherit;font-size:1rem;letter-spacing:0;line-height:1.35;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #2a1d1633;border-radius:0;padding:10px 6px;cursor:pointer}
.card button.opt:hover,.card button.opt:focus-visible{background:#2a1d1612;outline:none;box-shadow:inset 3px 0 0 var(--seal)}
.card button.opt:disabled{opacity:.45;cursor:not-allowed}
.card .n{font-family:var(--ui);font-size:.6rem;color:var(--seal);flex:none}
.card .t{min-width:0}
.card em{display:block;font-family:var(--ui);font-style:normal;font-size:.55rem;letter-spacing:.06em;color:var(--faded);margin-top:4px;text-transform:uppercase}
.bindgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(58px,auto));gap:6px 8px;align-items:center;margin-top:8px}
.bl{font-size:1rem;min-width:0}
.card button.slot{font-family:var(--ui);font-size:.58rem;letter-spacing:.04em;color:var(--ink);background:#ffffff55;border:1px solid #2a1d1655;border-bottom-width:2px;border-radius:3px;padding:7px 6px;min-height:30px}
.card button.slot:hover{background:#ffffff88}
.card button.slot.empty{color:var(--faded)}
.card button.slot.cap{background:var(--seal);color:var(--paper);border-color:var(--seal)}
.card button.slot:focus-visible{outline:2px solid var(--seal);outline-offset:1px}
.card .row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.card button.act{font-family:var(--ui);font-size:.62rem;color:var(--ink);background:transparent;border:1px solid #2a1d1666;border-radius:3px;padding:9px 12px}
.card button.act.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card button.act:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.notewrap{width:100%;max-width:440px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px}
.notemeta{margin:0;font-family:var(--ui);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.doc{position:relative;margin:0 6px;padding:22px 26px;box-shadow:0 18px 40px #000b;font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-size:1.6rem;line-height:1.15;transform:rotate(-1deg)}
.doc p{margin:0 0 6px}
.doc .sig{text-align:right;margin-top:10px}
.doc-chalk{background:repeating-linear-gradient(90deg,#2c241e 0 46px,#261f1a 46px 48px,#30271f 48px 96px);color:#efeadf;text-transform:uppercase;font-weight:500;font-size:1.45rem;letter-spacing:.02em;text-shadow:0 0 1px #fff9,1px 1px 0 #0006;transform:rotate(1.5deg);border:6px solid #3e2c1e}
.doc-chalk .big{font-size:1.8rem;font-weight:700;margin-top:10px;transform:rotate(-2deg)}
.doc-decree{background:radial-gradient(70% 50% at 80% 10%,#c4a87a55,transparent),#e3d6bd;color:#2a1d16;font-family:"IM Fell English",Georgia,serif;font-size:1.1rem;line-height:1.35;text-align:center;border:1px solid #8a7458;outline:3px double #6e5a48;outline-offset:-9px;padding:26px 30px 34px}
.doc-decree .hdr{font-family:var(--display);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:#6e5a48}
.doc-decree .wanted{font-family:var(--display);font-size:2.6rem;line-height:1;color:#8e2f22;margin:4px 0 10px}
.doc-decree .small{font-size:.95rem;font-style:italic;color:#4a3828}
.doc-decree .sig{font-family:"Caveat",cursive;font-size:1.5rem;text-align:right}
.doc-decree::after{content:"";position:absolute;right:22px;bottom:-12px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c0443a,#7a1c16 70%);box-shadow:0 2px 4px #0007}
.doc-letter{background:repeating-linear-gradient(180deg,transparent 0 31px,#9fb2c855 31px 32px),#efe6d2;background-position:0 14px;color:#22304a;line-height:32px;padding-top:18px}
.doc-journal{background:repeating-linear-gradient(180deg,transparent 0 29px,#8a7a6255 29px 30px),#d9cbb0;color:#3a2e26;line-height:30px;transform:rotate(.8deg);border-left:3px solid #b8a688}
.doc-journal .date{font-size:1.2rem;color:#7a6a58}
.doc-journal .sketch{float:right;width:118px;margin:0 0 4px 10px;shape-outside:margin-box}
.doc-shield{background:radial-gradient(circle at 35% 28%,#9aa0a6,#5a5e64 55%,#33363a);color:#eef1f3;text-align:center;text-transform:uppercase;font-size:1.3rem;letter-spacing:.03em;text-shadow:0 1px 0 #000c,0 0 1px #fff6;border:6px solid #6e5a48;border-radius:46% 46% 50% 50% / 30% 30% 70% 70%;padding:34px 40px 60px;transform:rotate(-2deg)}
.doc-shield .big{font-size:1.7rem;font-weight:700;color:#ffd2b8}
.doc-mother{background:linear-gradient(180deg,#f2ead8 49.6%,#e2d8c2 50%,#f2ead8 51%),#f2ead8;color:#5a4a6e;opacity:.97;padding-right:70px}
.doc-mother .flower{position:absolute;right:14px;top:16px;width:40px;opacity:.85}

  const B = {w, h,
    solid:(a, b, c, d) => S(a, b, c, d, '#'), clear:(a, b, c, d) => S(a, b, c, d, '.'),
    ledge:(a, c, y) => S(a, y, c, y, '-'), stakes:(a, c, y) => S(a, y, c, y, '^'), crumble:(a, c, y) => S(a, y, c, y, '~'),
    slag:(a, c, y) => S(a, y, c, y, 'm'), thorns:(a, c, y) => S(a, y, c, y, 'z'),
    put:(t, x, y) => ents.push({t, x, y})};
  if (opt.indoor) B.solid(0, 0, w - 1, 0);
  B.solid(0, 0, 0, h - 1); B.solid(w - 1, 0, w - 1, h - 1); B.solid(0, h - 1, w - 1, h - 1);
  build(B);
  const crumbleTiles = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (g[y][x] === '~') crumbleTiles.push([x, y]);
  const r = {key, name, gx, gy, cw, ch, w, h, pw:w * T, ph:h * T, ox:gx * CW * T, oy:gy * CH * T, crumbleTiles,

  ROOMS[key] = r;
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) BYPOS[(gx + x) + ',' + (gy + y)] = key;
}

    } else {
      drawSprite(SPR.O, cxNpc - 16, base, false, tick, 3);
      ctx.fillStyle = '#5a3a1e'; ctx.save(); ctx.translate(cxNpc + 4, base - 6); ctx.rotate(-.12);
      ctx.fillRect(-4, -4, 34, 7); ctx.fillStyle = '#8a5a30'; ctx.fillRect(-4, -4, 34, 1); ctx.fillStyle = '#3a2412'; ctx.fillRect(-4, 2, 34, 1); ctx.fillRect(10, -4, 1, 7);
      ctx.fillStyle = '#9aa0a3'; ctx.fillRect(26, -6, 2, 10); ctx.restore();
      ctx.fillStyle = '#5c4f45'; ctx.fillRect(cxNpc + 8, base - 4, 5, 4); ctx.fillStyle = '#4b3f37'; ctx.fillRect(cxNpc + 2, base - 3, 4, 3); ctx.fillRect(cxNpc + 16, base - 3, 6, 3);
      if ((tick >> 4) % 6 === 0) { ctx.fillStyle = '#d1a07a'; ctx.fillRect(cxNpc - 18, base - 5, 2, 1); }
    }
  } else if (it.t === 'i') {
    const ax = flip ? cxNpc + 9 : cxNpc - 21;
    ctx.fillStyle = '#3a3a40'; ctx.fillRect(ax + 2, base - 4, 8, 4); ctx.fillStyle = '#5e646c'; ctx.fillRect(ax, base - 8, 12, 4); ctx.fillStyle = '#8a8e96'; ctx.fillRect(ax, base - 8, 12, 1);
    if (!save.flags.ilseFree) { ctx.fillStyle = '#6e7478'; for (let i = 0; i < 6; i++) ctx.fillRect(Math.round(ax + 6 + (cxNpc - ax - 6) * i / 6), base - 2 - (i % 2), 2, 1); }
    drawSprite(SPR.i, cxNpc - 8, base, flip, tick, 6);
  } else if (it.t === 'n') {
    const px = flip ? cxNpc - 9 : cxNpc + 7; ctx.fillStyle = '#5a3a1e'; ctx.fillRect(px, base - 30, 2, 30); ctx.fillStyle = '#7a5230'; ctx.fillRect(px, base - 30, 2, 1);
    drawSprite(SPR.n, cxNpc - 8, base, flip, tick, 7);
  } else if (it.t === 'p') {
    const rx = flip ? cxNpc - 14 : cxNpc + 10; ctx.fillStyle = '#4e6a3a'; ctx.fillRect(rx, base - 6, 1, 6); ctx.fillStyle = '#e8e4dc'; ctx.fillRect(rx - 1, base - 8, 3, 2);
    drawSprite(SPR.p, cxNpc - 8, base, flip, tick, 8);
  } else if (it.t === 'v') {
    drawSprite(SPR.v, cxNpc - 8, base, flip, tick, 5);
  } else if (it.t === 's') {
    const fr = drawSprite(SPR.s, cxNpc - 8, base, flip, tick, 4);
    const hx = flip ? cxNpc - 8 + (16 - 1 - 14) : cxNpc - 8 + 14, hy = base - fr.h + 11;
    ctx.fillStyle = '#c9a060';
    for (let i = 0; i < 8; i++) { const yy = hy + 2 + i, xx = hx + Math.round(Math.sin(tick * .2 + i * .9) * 1); ctx.fillRect(xx, yy, 1, 1); }
  }
}

/* ---------- Loop ---------- */
let last = 0, acc = 0;
function frame(t) {
  if (!last) last = t;
  acc += Math.min(100, t - last); last = t;
  try { pollPad(); } catch (e) {}
  while (acc >= 1000/60) { update(); acc -= 1000/60; }
  try { netTick(); } catch (e) { console.warn(e); }
  render();
  try { musicTick(); } catch (e) {}
  requestAnimationFrame(frame);
}
function start(data) {
  const snap = data && data.snap;
  if (snap && ROOMS[snap.room] && snap.v === 2) {
    save = Object.assign(fresh(), snap.save); p.max = maxHp(); p.x = snap.x; p.y = snap.y; p.hp = snap.hp || p.max; enterRoom(snap.room);
  } else {
    if (save.won && !save.roam) { save = fresh(); persist(); }
    startAt('T');
  }
  if (save.worldV !== 2 && save.worldV !== 3 && save.worldV !== 4) {
    save.items = {}; let r = save.rations || 0, c = save.cogs || 0;
    for (const rm of RLIST) for (const e of rm.ents) {
      const id = rm.key + e.t + e.x;
      if (e.t === 'R' && r > 0) { save.items[id] = true; r--; }
      if (e.t === 'G' && save.hook) save.items[id] = true;
      if (e.t === 'Q' && save.whet) save.items[id] = true;
      if (e.t === 'C' && save.arenas[rm.key] && c > 0) { save.items[id] = true; c--; }
    }
    save.worldV = 2; persist();
  }
  if (save.worldV === 2 || save.worldV === 3) {
    save.dbl = false;
    for (const rm of RLIST) for (const e of rm.ents) if (e.t === 'Y') delete save.items[rm.key + e.t + e.x];
    if (save.cp && 'GLMNQRX'.includes(save.cp.k)) save.cp = null;
    if (room.key !== 'T') startAt('T');
    save.worldV = 4; persist();
  }
  applyGateOpen(); if (save.gateOpen) gateLiftT = 999;
  if (!save.lookV2) { if (save.look && save.look.hood === 'crimson') save.look.hood = 'class'; save.lookV2 = true; persist(); }
  parts = []; openTitle();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({snap:{v:2, save, room:room && room.key, x:p.x, y:p.y, hp:p.hp}})); } catch (e) {}
const hot = window.claude?.hot;
hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
})();
